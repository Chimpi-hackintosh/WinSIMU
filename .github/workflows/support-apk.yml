name: Verify support notice and build APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore verified owner source and apply changes
        run: python3 scripts/prepare_support_build.py
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build the real Android application
        working-directory: build-source
        run: |
          chmod +x gradlew
          ./gradlew :limbo-android-lib:testDebugUnitTest :limbo-android-x86:testDebugUnitTest :limbo-android-x86:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WinSIMU-support-APK
          path: build-source/limbo-android-x86/build/outputs/apk/debug/*.apk
          if-no-files-found: error
